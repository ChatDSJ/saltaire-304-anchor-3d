const M = {
  steel: new THREE.MeshStandardMaterial({ color: 0x232323, roughness: 0.62, metalness: 0.45, side: THREE.DoubleSide }),
  iron: new THREE.MeshStandardMaterial({ color: 0x1c1c1c, roughness: 0.85, metalness: 0.3, side: THREE.DoubleSide }),
  ironRaised: new THREE.MeshStandardMaterial({ color: 0x2c2c2c, roughness: 0.7, metalness: 0.35 }),
  inner: new THREE.MeshStandardMaterial({ color: 0x0b0b0b, roughness: 1, side: THREE.DoubleSide }),
  glass: new THREE.MeshPhysicalMaterial({ color: 0xbfd3dc, roughness: 0.05, transmission: 0.0, transparent: true, opacity: 0.22, side: THREE.DoubleSide, depthWrite: false }),
  ember: new THREE.MeshStandardMaterial({ color: 0xff7a1a, emissive: 0xff4a00, emissiveIntensity: 1.4, roughness: 1 }),
  log: new THREE.MeshStandardMaterial({ color: 0x5a3a22, roughness: 1 }),
  grate: new THREE.MeshStandardMaterial({ color: 0x151515, roughness: 0.9, metalness: 0.4 }),
};

// ---------- helpers ----------
function box(w, h, d, mat, x = 0, y = 0, z = 0) { const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat); m.position.set(x, y + h / 2, z); return m; }
function cyl(rBot, rTop, h, mat, y = 0, seg = 64, open = false) { const m = new THREE.Mesh(new THREE.CylinderGeometry(rTop, rBot, h, seg, 1, open), mat); m.position.y = y + h / 2; return m; }
function poly(nSides, rBot, rTop, h, mat, y = 0, rot = 0, open = false) { // regular prism/frustum; r = circumradius
  const m = new THREE.Mesh(new THREE.CylinderGeometry(rTop, rBot, h, nSides, 1, open), mat); m.position.y = y + h / 2; m.rotation.y = rot; return m;
}
// rectangular frustum (w,d at bottom -> w2,d2 at top), open top/bottom optional
function rectFrustum(w, d, w2, d2, h, mat, y = 0, dz2 = 0) {
  const g = new THREE.BufferGeometry();
  const b = [[-w / 2, 0, -d / 2], [w / 2, 0, -d / 2], [w / 2, 0, d / 2], [-w / 2, 0, d / 2]];
  const t = [[-w2 / 2, h, -d2 / 2 + dz2], [w2 / 2, h, -d2 / 2 + dz2], [w2 / 2, h, d2 / 2 + dz2], [-w2 / 2, h, d2 / 2 + dz2]];
  const pos = [];
  const quad = (a, b2, c, d3) => { pos.push(...a, ...b2, ...c, ...a, ...c, ...d3); };
  for (let i = 0; i < 4; i++) { const j = (i + 1) % 4; quad(b[i], b[j], t[j], t[i]); }
  quad(t[0], t[1], t[2], t[3]); quad(b[3], b[2], b[1], b[0]);
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3)); g.computeVertexNormals();
  const m = new THREE.Mesh(g, mat); m.position.y = y; return m;
}
function lathe(pts, mat, y = 0, seg = 96, phiStart = 0, phiLen = Math.PI * 2) {
  const m = new THREE.Mesh(new THREE.LatheGeometry(pts.map(p => new THREE.Vector2(p[0], p[1])), seg, phiStart, phiLen), mat); m.position.y = y; return m;
}
// trumpet profile from rBot at y0 to rTop at y1, k controls flare
function trumpet(rBot, rTop, y0, y1, k = 3, n = 40) {
  const pts = [];
  for (let i = 0; i <= n; i++) { const t = i / n; pts.push([rTop + (rBot - rTop) * Math.pow(1 - t, k), y0 + (y1 - y0) * t]); }
  return pts;
}
function fire(g, w, d, y, scale = 1) {
  const logs = new THREE.Group();
  for (let i = 0; i < 3; i++) {
    const l = new THREE.Mesh(new THREE.CylinderGeometry(35 * scale, 35 * scale, w * 0.75, 12), M.log);
    l.rotation.z = Math.PI / 2; l.rotation.y = (i - 1) * 0.5; l.position.set(0, y + 35 * scale + (i === 1 ? 50 * scale : 0), (i - 1) * d * 0.15); logs.add(l);
  }
  const e = new THREE.Mesh(new THREE.BoxGeometry(w * 0.6, 18 * scale, d * 0.45), M.ember); e.position.y = y + 9 * scale; logs.add(e);
  const light = new THREE.PointLight(0xff7a2a, 0.0, 0); light.position.y = y + 150 * scale; light.userData.fire = true; logs.add(light);
  g.add(logs); return logs;
}
function basket(g, s, y) { // Don-Bar style wood basket (square) sitting on table
  const b = rectFrustum(s * 0.62, s * 0.62, s, s, 110, M.grate, y); g.add(b);
  fire(g, s * 0.7, s * 0.6, y + 40);
}
function glassRing(r, h, y, seg = 64) { return cyl(r, r, h, M.glass, y, seg, true); }
function glassBox(w, d, h, y) {
  const g = new THREE.Group();
  [[w, 4, 0, d / 2], [w, 4, 0, -d / 2]].forEach(([a, b, x, z]) => g.add(box(a, h, b, M.glass, x, y, z)));
  [[4, d, w / 2, 0], [4, d, -w / 2, 0]].forEach(([a, b, x, z]) => g.add(box(a, h, b, M.glass, x, y, z)));
  return g;
}
function flueToCeiling(g, r, y0, ceil, mat = M.steel) { g.add(cyl(r, r, ceil - y0, mat, y0, 48)); }

    g.add(rectFrustum(1227, 1227, 1180, 1180, T - 390, M.steel, 390));
    basket(g, 560, T);
    g.add(glassBox(800, 800, 495, T));
    const H = T + 495;
    g.add(rectFrustum(820, 820, 760, 760, 40, M.steel, H));
    g.add(rectFrustum(760, 760, 356, 356, 424, M.steel, H + 40));
    g.add(rectFrustum(356, 356, 510, 510, 1143, M.steel, H + 464));
    return g;
  }
});

// === Focus: official manufacturer 3D models (Sketchfab, published by Focus Création) ===
const FOCUS = [
  ['focus-gyrofocus', 'Gyrofocus', '4f7ee9e4255c4098a3c778271bb4cb7d', 'Ø1250 mm. Suspended, pivots 360°. Open (wood) or glazed.', 'https://focus-creation.com/en/chimney-gyrofocus-wood'],
  ['focus-domofocus', 'Domofocus', '722f761452dd45788b9b09c93ba2783b', 'Ø1100 mm. Suspended, pivots.', 'https://focus-creation.com/en/chimney-domofocus-magmafocus'],
  ['focus-ergofocus', 'Ergofocus', 'a2b92cc87f77459b81eab7ccbca3e722', 'Ø950 mm. Suspended, pivots.', 'https://focus-creation.com/en/chimney-ergofocus-paxfocus'],
  ['focus-bathyscafocus', 'Bathyscafocus', 'ccb9e99a75c34ca9b2c2df39d52295f0', 'Ø700 mm sphere. Suspended.', 'https://focus-creation.com/en/chimney-bathyscafocus-emifocus'],
  ['focus-slimfocus', 'Slimfocus (suspended)', '5375d1505ec340b7b2e4593da65c9c2e', 'Ø325 mm. Suspended.', 'https://focus-creation.com/en/chimney-slimfocus-suspendu-wood'],
];
FOCUS.forEach(([id, name, uid, dims, url]) => add({ id, group: 'Focus (official 3D models)', name, dims, sketchfab: uid, source: ['Focus product page', url], source2: ['Focus Création on Sketchfab', 'https://sketchfab.com/focus-creation/models'], refs: [] }));

// ---------- scene ----------
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(Math.min(2, window.devicePixelRatio));
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.outputColorSpace = THREE.SRGBColorSpace;
const scene = new THREE.Scene(); scene.background = new THREE.Color(0xeeeae2);
const pmrem = new THREE.PMREMGenerator(renderer); scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
const camera = new THREE.PerspectiveCamera(35, 1, 10, 50000);
const controls = new OrbitControls(camera, canvas); controls.enableDamping = true;
scene.add(new THREE.HemisphereLight(0xffffff, 0xb8ad9a, 0.9));
const sun = new THREE.DirectionalLight(0xffffff, 1.6); sun.position.set(2500, 4000, 3000); scene.add(sun);
// floor with a 1-foot grid
const floor = new THREE.Mesh(new THREE.PlaneGeometry(8000, 8000), new THREE.MeshStandardMaterial({ color: 0xd9d2c4, roughness: 0.95 }));
floor.rotation.x = -Math.PI / 2; scene.add(floor);
const grid = new THREE.GridHelper(305 * 20, 20, 0xb5ab98, 0xc7beac); grid.position.y = 1; scene.add(grid);
const ceilMat = new THREE.MeshStandardMaterial({ color: 0xf4f1ea, roughness: 1, side: THREE.DoubleSide, transparent: true, opacity: 0.55 });
const ceiling = new THREE.Mesh(new THREE.PlaneGeometry(2400, 2400), ceilMat); ceiling.rotation.x = Math.PI / 2; scene.add(ceiling);

let current = null, currentDef = null;
function resize() {
  const r = canvas.parentElement.getBoundingClientRect();
  renderer.setSize(r.width, r.height, false); camera.aspect = r.width / r.height; camera.updateProjectionMatrix();
}
window.addEventListener('resize', resize);

function bboxOf(obj) { const b = new THREE.Box3().setFromObject(obj, true); const s = new THREE.Vector3(); b.getSize(s); return { w: s.x, h: s.y, d: s.z, minY: b.min.y, maxY: b.max.y }; }

function show(id) {
  const def = MODELS.find(m => m.id === id); if (!def) return;
  currentDef = def;
  document.querySelectorAll('#list button').forEach(b => b.classList.toggle('on', b.dataset.id === id));
  document.getElementById('title').textContent = def.name;
  document.getElementById('dims').textContent = def.dims;
  const src = document.getElementById('src'); src.innerHTML = '';
  [def.source, def.source2].filter(Boolean).forEach(([t, u]) => { const a = document.createElement('a'); a.href = u; a.target = '_blank'; a.rel = 'noopener'; a.textContent = t; src.appendChild(a); });
  const refs = document.getElementById('refs'); refs.innerHTML = '';
  (def.refs || []).forEach(k => { if (REF[k]) { const im = document.createElement('img'); im.src = REF[k]; im.alt = k; im.onclick = () => window.open(REF[k]); refs.appendChild(im); } });
  const sf = document.getElementById('sf');
  if (def.sketchfab) {
    canvas.style.display = 'none'; sf.style.display = 'block';
    sf.src = `https://sketchfab.com/models/${def.sketchfab}/embed?autostart=1&ui_infos=0&ui_watermark_link=0&ui_hint=0&preload=1`;
    if (current) { scene.remove(current); current = null; }
    return;
  }
  sf.style.display = 'none'; sf.src = 'about:blank'; canvas.style.display = 'block'; resize();
  if (current) scene.remove(current);
  current = def.build(); scene.add(current);
  ceiling.visible = !!def.ceiling; if (def.ceiling) ceiling.position.y = def.ceiling + 1;
  const bb = bboxOf(current);
  const H = def.ceiling ? Math.min(bb.h, 1800) : bb.h; const cy = def.ceiling ? 900 : bb.h / 2;
  const dist = Math.max(bb.w, H) * 2.6 + 600;
  controls.target.set(0, cy, 0); const cd = def.cam || [0.55, 0.85]; camera.position.set(dist * cd[0], cy + dist * 0.18, dist * cd[1]); controls.update();
  history.replaceState(null, '', '#' + id);
}

// list
const list = document.getElementById('list'); let lastGroup = '';
MODELS.forEach(m => {
  if (m.group !== lastGroup) { const h = document.createElement('div'); h.className = 'grp'; h.textContent = m.group; list.appendChild(h); lastGroup = m.group; }
  const b = document.createElement('button'); b.textContent = m.name; b.dataset.id = m.id; b.onclick = () => show(m.id); list.appendChild(b);
});

function loop() { controls.update(); renderer.render(scene, camera); requestAnimationFrame(loop); }
resize(); show((location.hash || '').slice(1) || MODELS[0].id); loop();

// verification hooks
window.__V = {
  models: () => MODELS.map(m => ({ id: m.id, name: m.name, expect: m.expect || null, sketchfab: m.sketchfab || null, ceiling: m.ceiling || null })),
  measure: (id) => { const d = MODELS.find(m => m.id === id); if (!d || d.sketchfab) return null; const o = d.build(); return bboxOf(o); },
  show,
};
window.__ready = true;

</script>
