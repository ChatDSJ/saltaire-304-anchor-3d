<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// ---------- plan data (feet). x = east, z = south, y = up. origin = NW inside corner ----------
const W = 14 + 5/12;           // inside width
const KEND = 12.42;            // kitchen ends, dining starts
const SHOW_S = 17;             // show a bit of dining
const H = 8;                   // ceiling (assumed; filed set has no ceiling height)
const WALL = 0.67;
const C = 26/12;               // counter depth
const CH = 3;                  // counter height 36"
const DOOR = {z0:3.44, z1:6.29, h:6.667};
const RANGE = {x:7.20-1.5, w:3};
const FR = {x:11.42, w:3, d:2.5, h:70/12};

const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({canvas, antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
const scene = new THREE.Scene();
scene.background = new THREE.Color(0xe9e6df);
const camera = new THREE.PerspectiveCamera(50, 2, 0.1, 500);
const controls = new OrbitControls(camera, canvas);
controls.enableDamping = true;

scene.add(new THREE.HemisphereLight(0xffffff, 0x9a8c78, 1.25));
const sun = new THREE.DirectionalLight(0xfff1dc, 1.3);
sun.position.set(22, 30, 18); sun.castShadow = true;
sun.shadow.mapSize.set(2048,2048);
Object.assign(sun.shadow.camera,{left:-20,right:20,top:20,bottom:-20,near:1,far:90});
sun.target.position.set(W/2,0,8); scene.add(sun, sun.target);

const M = c => new THREE.MeshStandardMaterial({color:c, roughness:.8});
const mat = {
  floor:M(0xd9c6a5), wall:M(0xf4f1ea), cab:null, top:new THREE.MeshStandardMaterial({color:0xf3f0e8,roughness:.35}),
  steel:new THREE.MeshStandardMaterial({color:0xc8ccd0,metalness:.6,roughness:.35}), black:M(0x2a2a2a),
  fridge:new THREE.MeshStandardMaterial({color:0xdfe3e6,metalness:.45,roughness:.35}),
  glass:new THREE.MeshStandardMaterial({color:0xbfe0f2,transparent:true,opacity:.35,roughness:.1}),
  door:M(0x8a5a34), deck:M(0xa98b66), sink:new THREE.MeshStandardMaterial({color:0xb8964e,metalness:.75,roughness:.32}),
  brassF:new THREE.MeshStandardMaterial({color:0xc9a14c,metalness:.85,roughness:.25}),
  kick:M(0x241a14), grid:M(0x000000)
};
function woodTex(base, seedv){
  const cv=document.createElement('canvas'); cv.width=256; cv.height=512; const x=cv.getContext('2d');
  x.fillStyle=base; x.fillRect(0,0,256,512); let sd=seedv; const r=()=>{ sd=(sd*16807)%2147483647; return (sd-1)/2147483646; };
  for(let i=0;i<26;i++){ const px=r()*256, w=6+r()*18; x.fillStyle=(r()<0.5?'rgba(40,20,8,':'rgba(255,215,160,')+(0.04+r()*0.06)+')'; x.fillRect(px,0,w,512); }
  for(let i=0;i<220;i++){ const px=r()*256, w=0.4+r()*1.4, a=0.05+r()*0.12, ph=r()*6; x.strokeStyle=(r()<0.65?'rgba(35,18,6,':'rgba(255,220,170,')+a+')'; x.lineWidth=w;
    x.beginPath(); x.moveTo(px,0); for(let y=0;y<=512;y+=16) x.lineTo(px+Math.sin(y/140+ph)*1.2,y); x.stroke(); }
  const t=new THREE.CanvasTexture(cv); t.colorSpace=THREE.SRGBColorSpace; return t; }
const WOODS={walnut:'#6e3f22', teak:'#a3622f', rosewood:'#55241a', oak:'#b8854e', ash:'#d2b489'};
function shade(hex,d){ const n=parseInt(hex.slice(1),16); const f=v=>Math.max(0,Math.min(255,v+d)); return '#'+[(n>>16)&255,(n>>8)&255,n&255].map(v=>f(v).toString(16).padStart(2,'0')).join(''); }
const woodMats=[], texCache={};
const walnut=(dl,sd)=>{ const m=new THREE.MeshStandardMaterial({map:woodTex(shade(WOODS.walnut,dl),sd),roughness:.55}); woodMats.push({m,dl,sd}); return m; };
function setWood(k){ woodMats.forEach(o=>{ const id=k+o.dl+'_'+o.sd; o.m.map=texCache[id]||(texCache[id]=woodTex(shade(WOODS[k],o.dl),o.sd)); o.m.needsUpdate=true; });
  document.querySelectorAll('[data-wood]').forEach(b=>b.classList.toggle('on',b.dataset.wood===k)); }
mat.cab=walnut(0,17);
function box(x0,x1,y0,y1,z0,z1,m,parent=scene){
  const g = new THREE.Mesh(new THREE.BoxGeometry(x1-x0,y1-y0,z1-z0), m);
  g.position.set((x0+x1)/2,(y0+y1)/2,(z0+z1)/2); g.castShadow = g.receiveShadow = true; parent.add(g); return g;
}

// ---------- floor + 1 ft grid ----------
box(-WALL, W+WALL, -0.1, 0, -WALL, SHOW_S, mat.floor);
const gridPts=[];
for(let i=1;i<W;i++) gridPts.push(i,0.005,0, i,0.005,SHOW_S);
for(let j=1;j<SHOW_S;j++) gridPts.push(0,0.005,j, W,0.005,j);
const gg=new THREE.BufferGeometry(); gg.setAttribute('position',new THREE.Float32BufferAttribute(gridPts,3));
const grid=new THREE.LineSegments(gg,new THREE.LineBasicMaterial({color:0x8a7550,transparent:true,opacity:.28}));
scene.add(grid);

// ---------- walls (grouped so the ones facing the camera fade) ----------
const walls = {N:new THREE.Group(), W:new THREE.Group(), E:new THREE.Group()};
Object.values(walls).forEach(g=>scene.add(g));
box(-WALL, W+WALL, 0, H, -WALL, 0, mat.wall, walls.N);                 // north: solid (window removed)
// west dining windows
box(-WALL, 0, 0, 2.5, KEND, SHOW_S, mat.wall, walls.W);
box(-WALL, 0, 2.5, 7, KEND, SHOW_S, mat.glass, walls.W);
box(-WALL, 0, 7, H, KEND, SHOW_S, mat.wall, walls.W);
// east wall with deck door
box(W, W+WALL, 0, H, -WALL, DOOR.z0, mat.wall, walls.E);
box(W, W+WALL, DOOR.h, H, DOOR.z0, DOOR.z1, mat.wall, walls.E);
box(W, W+WALL, 0, H, DOOR.z1, KEND, mat.wall, walls.E);
box(W, W+WALL, 0, 2.5, KEND, SHOW_S, mat.wall, walls.E);
box(W, W+WALL, 2.5, 7, KEND, SHOW_S, mat.glass, walls.E);
box(W, W+WALL, 7, H, KEND, SHOW_S, mat.wall, walls.E);
// door leaf: hinged at south jamb, outside face, open 90 degrees onto the deck
const dw = DOOR.z1-DOOR.z0;
const leaf = box(W+WALL, W+WALL+dw, 0, DOOR.h, DOOR.z1-0.15, DOOR.z1, mat.door);
box(W+WALL+0.35, W+WALL+dw-0.35, 1.2, DOOR.h-0.8, DOOR.z1-0.16, DOOR.z1+0.01, mat.glass);
// bit of BBQ deck outside
box(W+WALL, W+WALL+6, -0.12, -0.02, -WALL, 9, mat.deck);

// ---------- cabinets ----------
function baseRun(x0,x1,z0,z1,opts={}){
  const kick=0.33, inset=0.25;
  // toe kick recessed on the given front side(s)
  const f = opts.front||'S';
  let kx0=x0,kx1=x1,kz0=z0,kz1=z1;
  if(f==='S') kz1-=inset; if(f==='N') kz0+=inset; if(f==='E') kx1-=inset; if(f==='W') kx0+=inset;
  if(f==='NS'){kz0+=inset;kz1-=inset}
  box(kx0,kx1,0,kick,kz0,kz1,mat.kick);
  box(x0,x1,kick,CH-0.125,z0,z1,mat.cab);
  box(x0-(opts.ohW||0),x1+(opts.ohE||0),CH-0.125,CH,z0-(opts.ohN||0),z1+(opts.ohS||0),mat.top);
}
// north counter, left of range and right of range (to filler)
baseRun(0, RANGE.x, 0, C);
baseRun(RANGE.x+RANGE.w, 10.91, 0, C);
baseRun(10.91, 11.42, 0, C);                 // 6" pull-out
// west counter (continuous 6'-3" between north run and peninsula)
baseRun(0, C, C, 8.42, {front:'E'});
// peninsula 10'-11" x 4'-0"
// west end: 4'-6" knee space on the dining side for 2 stools (15" deep, counter overhangs)
const KNEE = {x1:4.5, d:1.25};
baseRun(KNEE.x1, 10.91, 8.42, 12.42, {front:'NS'});
baseRun(0, KNEE.x1, 8.42, 12.42-KNEE.d, {front:'N', ohS:KNEE.d});
// peninsula dining side: tall flat doors (push-latch) east of the knee space
{ const n=4, z=12.42; for(let k=0;k<=n;k++){ const x=KNEE.x1+(10.91-KNEE.x1)*k/n; box(x-0.012,x+0.012,0.33,CH-0.125,z,z+0.01,new THREE.MeshStandardMaterial({color:0x1e120a})); } }
// cabinet door lines (subtle) on fronts
const lineM=new THREE.LineBasicMaterial({color:0x2a170b});
function frontLines(xs, z, y0=0.4, y1=CH-0.2){
  const p=[]; xs.forEach(x=>p.push(x,y0,z, x,y1,z));
  const g=new THREE.BufferGeometry(); g.setAttribute('position',new THREE.Float32BufferAttribute(p,3)); scene.add(new THREE.LineSegments(g,lineM));
}
// flat-front drawers, no pulls: dark reveal strips between stacks and drawers
const revM=new THREE.MeshStandardMaterial({color:0x1e120a,roughness:.9});
const DR=[0.33, 1.25, 2.12, CH-0.125];                       // drawer breaks: 3 drawers per stack
function drawersN(x0,x1,n){ const z=C;
  for(let k=1;k<n;k++){ const x=x0+(x1-x0)*k/n; box(x-0.012,x+0.012,0.33,CH-0.125,z,z+0.01,revM); }
  DR.slice(1,-1).forEach(y=>box(x0,x1,y-0.012,y+0.012,z,z+0.01,revM));
  [x0,x1].forEach(x=>box(x-0.012,x+0.012,0.33,CH-0.125,z,z+0.01,revM)); }
function drawersW(z0,z1,n){ const x=C;
  for(let k=1;k<n;k++){ const z=z0+(z1-z0)*k/n; box(x,x+0.01,0.33,CH-0.125,z-0.012,z+0.012,revM); }
  DR.slice(1,-1).forEach(y=>box(x,x+0.01,y-0.012,y+0.012,z0,z1,revM)); }
drawersN(C, RANGE.x, 2); drawersN(RANGE.x+RANGE.w, 10.91, 1); drawersN(10.91, 11.42, 1);
drawersW(C, 8.42, 3);

// ---------- range 36" ----------
box(RANGE.x, RANGE.x+RANGE.w, 0, CH-0.05, 0.05, C, mat.fridge);
box(RANGE.x+0.35, RANGE.x+RANGE.w-0.35, 0.95, 1.85, C, C+0.01, M(0x303236));         // oven window
box(RANGE.x+0.3, RANGE.x+RANGE.w-0.3, 2.14, 2.2, C+0.02, C+0.1, mat.steel);         // oven handle
box(RANGE.x+0.05, RANGE.x+RANGE.w-0.05, 2.35, CH-0.1, C, C+0.01, mat.steel);        // front control panel (stainless)
[0.45,0.9,1.35,1.65,2.1,2.55].forEach(dx=>{ const k=new THREE.Mesh(new THREE.CylinderGeometry(0.09,0.09,0.08,18),M(0x3a3c3f));
  k.rotation.x=Math.PI/2; k.position.set(RANGE.x+dx, 2.62, C+0.05); scene.add(k); });
box(RANGE.x, RANGE.x+RANGE.w, CH-0.05, CH, 0.05, C, mat.fridge);                  // stainless cooktop
box(RANGE.x+0.15, RANGE.x+RANGE.w-0.15, CH, CH+0.015, 0.08, 0.28, M(0x444444));   // flat rear vent (no backguard)
[[0.6,0.7],[1.5,0.7],[2.4,0.7],[0.6,1.6],[1.5,1.6],[2.4,1.6]].forEach(([dx,dz])=>{
  const b=new THREE.Mesh(new THREE.CylinderGeometry(0.28,0.28,0.04,24),mat.black);
  b.position.set(RANGE.x+dx, CH+0.02, dz+0.2); scene.add(b);
});
// hood
box(RANGE.x-0.1, RANGE.x+RANGE.w+0.1, 5.4, 6.3, 0, 1.75, mat.fridge);
box(RANGE.x+0.9, RANGE.x+RANGE.w-0.9, 6.3, H, 0, 1.0, mat.fridge);

// ---------- fridge 36" in NE corner: Sub-Zero options (toggle) + click to open ----------
const FRH = 7.0;                                   // all options 84" tall, 24" deep, face flush with cabinets
const FZ = C;                                      // front face
box(FR.x, FR.x+FR.w, FRH, H, 0, C, mat.cab);       // cabinet above
const FRIDGES = {}, FRPARTS = {};
{ const x0=FR.x, x1=FR.x+FR.w, w=FR.w, z=FZ, DT=0.2, ZI=z-DT, BK=0.15, T=0.1, gap=0.012;
  const std=(c,o={})=>new THREE.MeshStandardMaterial({color:c,roughness:.4,...o});
  const LINER={ steel:std(0xd4d8dc,{metalness:.5,roughness:.3,emissive:0x2a2c2e}), white:std(0xf7f7f5,{emissive:0x3a3a38}) };
  const glassSh=std(0xdff2f8,{transparent:true,opacity:.45,roughness:.05}), trim=std(0xc8ccd0,{metalness:.7,roughness:.25});
  const clear=std(0xe8f4fa,{transparent:true,opacity:.35,roughness:.1}), bronze=std(0xa98a5a,{metalness:.7,roughness:.3});
  const food=[0xd8342c,0xf2b33d,0x5d9b3a,0xe8742a,0x7a3b6e,0xf4e27a,0x3f7d3a];
  const FM=food.map(c=>std(c,{roughness:.55}));
  const ball=(g,x,y,zz,r,m)=>{ const s=new THREE.Mesh(new THREE.SphereGeometry(r,14,10),m); s.position.set(x,y,zz); g.add(s); };
  const can=(g,x,y,zz,r,h,m)=>{ const s=new THREE.Mesh(new THREE.CylinderGeometry(r,r,h,14),m); s.position.set(x,y+h/2,zz); g.add(s); };
  const tube=(g,xa,xb,y,zf)=>{ const t=new THREE.Mesh(new THREE.CylinderGeometry(0.045,0.045,xb-xa,16),mat.steel); t.rotation.z=Math.PI/2; t.position.set((xa+xb)/2,y,zf+0.16); g.add(t);
    [xa+0.06,xb-0.06].forEach(x=>box(x-0.04,x+0.04,y-0.04,y+0.04,zf,zf+0.16,mat.steel,g)); };
  const tubeV=(g,x,ya,yb,zf)=>{ const t=new THREE.Mesh(new THREE.CylinderGeometry(0.045,0.045,yb-ya,16),mat.steel); t.position.set(x,(ya+yb)/2,zf+0.16); g.add(t);
    [ya+0.08,yb-0.08].forEach(y=>box(x-0.04,x+0.04,y-0.04,y+0.04,zf,zf+0.16,mat.steel,g)); };
  // hollow compartment (open at the front), y0..y1
  function cavity(g,y0,y1,L){ box(x0,x1,y0,y0+T,0,ZI,L,g); box(x0,x1,y1-T,y1,0,ZI,L,g);
    box(x0,x0+T,y0,y1,0,ZI,L,g); box(x1-T,x1,y0,y1,0,ZI,L,g); box(x0,x1,y0,y1,0,BK,L,g);
    box(x0+T,x1-T,y1-T-0.03,y1-T,BK,ZI-0.3,std(0xffffff,{emissive:0xfff6e0,emissiveIntensity:.9}),g); }   // LED strip
  function shelf(g,y,zf,slide){ box(x0+T,x1-T,y,y+0.03,BK,zf,glassSh,g); box(x0+T,x1-T,y-0.02,y+0.035,zf-0.04,zf,trim,g);
    if(slide){ box(x0+T+0.05,x0+T+0.08,y+0.03,y+0.25,BK+0.3,zf,trim,g); box(x1-T-0.08,x1-T-0.05,y+0.03,y+0.25,BK+0.3,zf,trim,g); } }
  // hinged door (hinge at the wall side = east), returns pivot group
  function door(g,y0,y1,face,parts,opts={}){
    const P=new THREE.Group(); P.position.set(x1,0,z); g.add(P);
    const D=(a,b,c,d,e,f,m)=>box(a-x1,b-x1,c,d,e-z,f-z,m,P);
    if(face==='steel'){ D(x0,x1,y0,y1,z-DT,z,mat.fridge); tubeV(P,x0+0.28-x1,y0+0.4,Math.min(y1-0.3,y0+3.4),0); P.children.at(-1); }
    else { D(x0,x1,y0,y1,z-DT,z-0.06,LINER.white); D(x0+0.01,x1-0.01,y0+0.01,y1-0.01,z-0.06,z,mat.cab); D(x0+0.04,x0+0.08,y0+1.0,y1-0.8,z,z+0.012,revM); }
    const inner=z-DT, L=opts.liner||LINER.white;
    D(x0+0.1,x1-0.1,y0+0.1,y1-0.1,inner-0.02,inner,L);                          // door liner
    (opts.bins||[]).forEach((yb,i)=>{ const zb=inner-0.36;

let seed=7; const rnd=()=>{ seed=(seed*16807)%2147483647; return (seed-1)/2147483646; };
const TILE_PX=1024, PPI=TILE_PX/24;                         // canvas = 24" x 24" repeat
function tileCanvas(style){
  const cv=document.createElement('canvas'); cv.width=cv.height=TILE_PX; const x=cv.getContext('2d');
  x.fillStyle=style.grout; x.fillRect(0,0,TILE_PX,TILE_PX);
  const g=style.groutIn*PPI; seed=style.seed;
  const draw=(px,py,w,h,col)=>{
    const gr=x.createLinearGradient(px,py,px+w,py+h);
    const sh=(c,k)=>'rgb('+c.map(v=>Math.max(0,Math.min(255,Math.round(v*k)))).join(',')+')';
    const j=1+(rnd()-0.5)*style.vary;
    gr.addColorStop(0,sh(col,j*1.06)); gr.addColorStop(0.5,sh(col,j)); gr.addColorStop(1,sh(col,j*0.9));
    x.fillStyle=gr; x.fillRect(px+g/2,py+g/2,w-g,h-g);
    if(style.gloss){ x.fillStyle='rgba(255,255,255,'+(0.10+rnd()*0.18)+')';          // glaze highlight
      const hy=py+h*(0.1+rnd()*0.5); x.fillRect(px+g/2+w*0.15,hy,w*0.25,h*0.18); }
  };
  const cols=Math.round(24/style.w);
  for(let c=0;c<cols;c++){
    const px=c*style.w*PPI;
    if(style.lengths){                                      // random stick lengths that add up to 24"
      let y=0, off=rnd()*24, segs=[];
      while(y<24){ let L=style.lengths[Math.floor(rnd()*style.lengths.length)]; if(y+L>24) L=24-y; segs.push(L); y+=L; }
      let yy=off; segs.forEach(L=>{ const col=style.colors[Math.floor(rnd()*style.colors.length)];
        [yy, yy-24].forEach(s=>draw(px,s*PPI,style.w*PPI,L*PPI,col)); yy=(yy+L)%24; });
    } else {
      for(let r=0;r<24/style.h;r++) draw(px,r*style.h*PPI,style.w*PPI,style.h*PPI,style.colors[Math.floor(rnd()*style.colors.length)]);
    }
  }
  const t=new THREE.CanvasTexture(cv); t.wrapS=t.wrapT=THREE.RepeatWrapping; t.colorSpace=THREE.SRGBColorSpace; t.anisotropy=8; return t;
}

const bsN=new THREE.MeshStandardMaterial({roughness:.28,metalness:0}), bsW=new THREE.MeshStandardMaterial({roughness:.28,metalness:0});
// flat panel with world-anchored UVs so tiles line up across panels
function tilePanel(axis, a0,a1,y0,y1, parent=scene){
  const geo=new THREE.PlaneGeometry(a1-a0,y1-y0); const uv=geo.attributes.uv, pos=geo.attributes.position;
  for(let i=0;i<uv.count;i++){ const la=pos.getX(i)+(a1-a0)/2, ly=pos.getY(i)+(y1-y0)/2; uv.setXY(i,(a0+la)/2,(y0+ly)/2); }
  const m=new THREE.Mesh(geo, axis==='N'?bsN:bsW); m.receiveShadow=true;
  if(axis==='N') m.position.set((a0+a1)/2,(y0+y1)/2,0.02);
  else { m.rotation.y=Math.PI/2; m.position.set(0.02,(y0+y1)/2,(a0+a1)/2); m.scale.x=-1; }
  parent.add(m); return m;
}

const ft = v => { let t=Math.round(v*12*2)/2, f=Math.floor(t/12), i=t-f*12; return (f?f+"'-":'')+String(i).replace('.5','½')+'"'; };

      const yTop = (m>SHELF.z0&&m<SHELF.z1) ? top : UP.y0;                  // tile runs up behind the open shelves
      const hs=holes.filter(h=>h.z0<m&&h.z1>m).sort((p,q)=>p.y0-q.y0); let y=CH;
      hs.forEach(h=>{ if(h.y0>y+0.02) tilePanel('W',a,b,y,Math.min(h.y0,yTop),ig); y=Math.max(y,h.y1); });
      if(yTop>y+0.02) tilePanel('W',a,b,y,yTop,ig); } }
  if(mk==='middle') box(UP.d, GD, UP.y0, top, 0, UP.d, mat.cab, ig);   // corner filler to the north uppers
  if(glass) tall.forEach(h=>[5.2,6.25].forEach(y=>box(0,0.85,y,y+0.04,h.z0+0.05,h.z1-0.05,glassShelfM,ig)));
  const key=mk+'_'+ok; WIN.groups[key]=[wg,ig]; const dg=new THREE.Group(); dimGroup.add(dg); WIN.dims[key]=dg;
  const D=(a,b,text,cls='dim')=>{ const lg=new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(...a),new THREE.Vector3(...b)]);
    dg.add(new THREE.Line(lg, cls==='clr'?clrM:dimM)); tag(text,(a[0]+b[0])/2,(a[1]+b[1])/2,(a[2]+b[2])/2,cls,'dims'); tags[tags.length-1].key=key; };
  dims.forEach(d=>D(...d));

  const T=(t,x,y,z)=>{ tag(t,x,y,z); tags[tags.length-1].key=key; };

  const big = segs.slice().sort((p,q)=>(q[1]-q[0])-(p[1]-p[0]))[0];

const OPTS=['solid','strip','center','picture','shelves','transom'];

{ let down=null; const rc=new THREE.Raycaster(), ndc=new THREE.Vector2();

function setWall(g,op){ g.traverse(o=>{ if(o.isMesh){ if(!o.userData.base){o.userData.base=o.material; o.material=o.material.clone();} o.material.transparent=true; o.material.opacity=o.userData.base.opacity*op; o.material.depthWrite=op>0.9; }}); }

  leaf.material.opacity=1;
}

const tmp=new THREE.Vector3(), ray=new THREE.Raycaster(), dirv=new THREE.Vector3();
const solids=[]; scene.traverse(o=>{ if(o.isMesh) solids.push(o); });
function shown(o){ for(;o;o=o.parent) if(!o.visible) return false; return true; }
function hidden(p){
  dirv.copy(p).sub(camera.position); const dist=dirv.length(); dirv.normalize();
  ray.set(camera.position,dirv); ray.far=dist-0.35;
  const hits=ray.intersectObjects(solids,false);
  return hits.some(h=>shown(h.object) && !(h.object.material.transparent && h.object.material.opacity<0.9));
}
let frame=0;

function loop(now){
